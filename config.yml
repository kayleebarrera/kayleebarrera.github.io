          title: Hi! I'm Kaylee Barrera.
          subtitle: 
              <span style="color:#052e80">*(she/they)*</span> <br><br>

              I am a first-year Astronomy PhD student and NSF Graduate Research Fellow at the [<span style="color:#052e80"><u>**Center for Astrophysics | Harvard & Smithsonian.**</u></span>](https://www.cfa.harvard.edu/)
              My research interests lie in detecting and characterizing [<span style="color:#052e80"><u>**exoplanets,**</u></span>](https://science.nasa.gov/exoplanets/) particularly in young planetary systems, to better understand planet formation and evolution. 
              Through my research, I hope to contextualize our place in the universe and the bizarreness of our home planet. <br><br>

              I am a *proud* New Jerseyan and did my undergraduate degree at [<span style="color:#052e80"><u>**MIT,**</u></span>](https://www.mit.edu/) where I double-majored in [<span style="color:#052e80"><u>**Planetary Science**</u></span>](https://eaps.mit.edu/) and [<span style="color:#052e80"><u>**Physics.**</u></span>](https://physics.mit.edu/) Outside of research, I enjoy trying new crafts, dilly-dallying around Boston, and writing silly reviews on Letterboxd.<br><br>

              <span style="color:#d55672; display:inline-flex; align-items:center;margin-top:-100px;"><img src="email_icon.svg" alt="email icon" style="width:35px; height:35px; margin-left:-2px;margin-right:2px;">*kaylee [dot] barrera [at] cfa [dot] harvard [dot] edu*</span>
